name: Rust build and verification

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Optional Pumpkin tag to validate against the workspace and master
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check release tag and reviewed branch ancestry
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -I scripts/release.py check --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/master
      - name: Check publication inventory, pins and release helpers
        run: |
          python -I scripts/check_repository.py
          python -I scripts/check_pins.py
          python -I -B -m unittest discover -s scripts/tests -v
      - name: Install pinned Rust tooling
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy --target wasm32-wasip2
      - name: Fetch locked dependency sources
        run: cargo fetch --locked
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Native tests
        run: cargo test --locked --offline -p vivecraft-core
      - name: Native lint
        run: cargo clippy --locked --offline -p vivecraft-core --all-targets -- -D warnings
      - name: Adapter lint
        run: cargo clippy --locked --offline -p vivecraft-pumpkin --target wasm32-wasip2 -- -D warnings
      - name: WASM release build
        run: cargo build --locked --offline --release -p vivecraft-pumpkin --target wasm32-wasip2
      - name: Package binary, licenses and complete corresponding source
        run: python -I scripts/release.py package --output dist/package
      - name: Upload build outputs (not Market-signed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pumpkin-wasm
          path: dist/package/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
