[workspace]
members = ["crates/vivecraft-core", "crates/vivecraft-pumpkin"]
default-members = ["crates/vivecraft-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "LGPL-3.0-only"
description = "Vivecraft sessions and VR protocol preview for the Pumpkin WASM plugin host"
repository = "https://github.com/AMD-Boii/Vivecraft-Pumpkin-Extension"
readme = "README.md"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.9.8"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
